<!doctype html>
<html lang="tr" data-theme="a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cüzdan" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-main.svg" />
    <link id="apple-icon" rel="apple-touch-icon" href="/icons/apple-touch-icon-main.png" />
    <title>Cüzdan</title>
    <script>
      // Tema ilk boyamadan önce uygulanır; yanlış renkte yanıp sönme olmaz.
      try {
        var t = localStorage.getItem('wallet.theme')
        if (t === 'a' || t === 'b' || t === 'c') document.documentElement.dataset.theme = t
        var l = localStorage.getItem('wallet.lang')
        if (l === 'tr' || l === 'en') document.documentElement.lang = l
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
